[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "mend"
version = "0.1.0"
description = "Restore supported NTSC animation DVDs for Spindle"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vapoursynth==78",
    "vsrepo==2.0.0",
]

[project.scripts]
mend = "mend.cli:main"

[tool.uv.build-backend]
module-root = ""
